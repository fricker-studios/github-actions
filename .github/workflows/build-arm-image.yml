name: Build ARM64 Image

# Builds linux/arm64 natively on one ARC scale set of the ci cluster and
# tags it `<image>:<sha>-arm64` (plus `<tag>-arm64` for every extra
# tag). build-multiarch-image.yml is the same build for both
# architectures plus the index; use this one for a single-arch image.
#
# Runners: ARC scale sets match `runs-on` on the SCALE-SET NAME ONLY —
# a label list such as `[self-hosted, ARM64]` never matches one, which
# is why this workflow could not run between 2026-02 and 2026-10. The name
# is the `arm_runner` input, default `arc-runner-fricker-arm64`.
#
# Registry: defaults to the lab's zot (`registry.lab.alexfricker.com`).
# An `image_name` with no registry host is pushed under that registry;
# one that already names a host (docker.io/..., ghcr.io/...) is used as
# given. Build cache: `type=registry` on `<image>:buildcache-arm64`,
# with the `image-manifest=true,oci-mediatypes=true` export zot needs;
# exported only when the build pushes.

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Image to build. Without a registry host it lands under `registry`; with one (docker.io/..., ghcr.io/...) it is used as given'
        required: true
        type: string
      dockerfile_path:
        description: 'Path to the Dockerfile'
        required: false
        type: string
        default: './Dockerfile'
      context:
        description: 'Build context path'
        required: false
        type: string
        default: '.'
      build_args:
        description: 'Build arguments (newline-separated KEY=VALUE pairs)'
        required: false
        type: string
        default: ''
      arm_runner:
        description: 'ARC scale set (runs-on) for the linux/arm64 build'
        required: false
        type: string
        default: 'arc-runner-fricker-arm64'
      push:
        description: 'Whether to push the image (and its build cache) to the registry'
        required: false
        type: boolean
        default: false
      registry:
        description: 'Registry to log in to and to prefix a host-less image_name with. Empty means Docker Hub and no login'
        required: false
        type: string
        default: 'registry.lab.alexfricker.com'
      tags:
        description: 'Additional tags for the image (newline-separated); each is suffixed -arm64, and the commit sha is always tagged'
        required: false
        type: string
        default: ''
      download_artifacts:
        description: 'Whether to download build artifacts before building'
        required: false
        type: boolean
        default: false
      artifact_name:
        description: 'Name of the artifact to download (if download_artifacts is true)'
        required: false
        type: string
        default: ''
      artifact_path:
        description: 'Path where artifact contents should be moved (relative to workspace root). If empty, contents will be moved to workspace root.'
        required: false
        type: string
        default: '.'
      sentry_dsn_var_name:
        description: 'Name of the build arg variable to use for Sentry DSN (e.g., SENTRY_DSN, DNS_SENTRY_DSN). If provided with sentry_dsn secret, will inject as build arg.'
        required: false
        type: string
        default: ''
    secrets:
      registry_username:
        description: 'Docker registry username'
        required: false
      registry_password:
        description: 'Docker registry password'
        required: false
      sentry_dsn:
        description: 'Sentry DSN for error tracking'
        required: false
    outputs:
      image_name:
        description: 'Image name without tag, registry included'
        value: ${{ jobs.build-arm.outputs.image_name }}
      image_tag:
        description: 'Short image tag (commit-sha-arm64)'
        value: ${{ jobs.build-arm.outputs.image_tag }}
      image_fullname:
        description: 'Full image name with tag (image_name:image_tag)'
        value: ${{ jobs.build-arm.outputs.image_fullname }}
      digest:
        description: 'Image digest'
        value: ${{ jobs.build-arm.outputs.digest }}

jobs:
  build-arm:
    name: Build and Push ARM64 Image
    runs-on: ${{ inputs.arm_runner }}
    timeout-minutes: 60
    outputs:
      image_name: ${{ steps.output.outputs.image_name }}
      image_tag: ${{ steps.output.outputs.image_tag }}
      image_fullname: ${{ steps.output.outputs.image_fullname }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        if: inputs.download_artifacts == true
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_path }}

      - name: Verify artifacts
        if: inputs.download_artifacts == true
        env:
          ARTIFACT_PATH: ${{ inputs.artifact_path }}
        run: |
          echo "✅ Artifacts downloaded to: $ARTIFACT_PATH"
          echo ""
          echo "=== Workspace structure ==="
          ls -la
          echo ""
          if [ -d "frontend" ]; then
            echo "=== frontend/ contents ==="
            ls -la frontend/
            echo ""
            if [ -d "frontend/dist" ]; then
              echo "=== frontend/dist/ contents (first 20 items) ==="
              # shellcheck disable=SC2012
              ls -la frontend/dist/ | head -20
            fi
          fi
          if [ -d "staticfiles" ]; then
            echo ""
            echo "=== staticfiles/ contents (first 20 items) ==="
            # shellcheck disable=SC2012
            ls -la staticfiles/ | head -20
          fi

      # The image reference the tags are built from: `registry/image_name`
      # unless image_name already starts with a registry host. Docker's
      # rule — the first path component is a host when it contains a `.`
      # or a `:`, or is `localhost`.
      - name: Resolve image reference
        id: ref
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          REGISTRY: ${{ inputs.registry }}
        run: |
          set -euo pipefail
          has_host=false
          if [[ "$IMAGE_NAME" == */* ]]; then
            first="${IMAGE_NAME%%/*}"
            if [[ "$first" == *.* || "$first" == *:* || "$first" == localhost ]]; then
              has_host=true
            fi
          fi
          if [ -n "$REGISTRY" ] && [ "$has_host" = false ]; then
            ref="$REGISTRY/$IMAGE_NAME"
          else
            ref="$IMAGE_NAME"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Image reference: $ref"

      - name: Login to Container Registry
        if: inputs.push == true && inputs.registry != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ inputs.registry }}
          username: ${{ secrets.registry_username }}
          password: ${{ secrets.registry_password }}

      # A docker-container builder: the default docker driver cannot
      # export a registry cache. Runs inside the pod's dind sidecar.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare build args
        id: prepare-args
        env:
          BUILD_ARGS: ${{ inputs.build_args }}
          SENTRY_DSN: ${{ secrets.sentry_dsn }}
          SENTRY_DSN_VAR_NAME: ${{ inputs.sentry_dsn_var_name }}
        run: |
          set -euo pipefail
          # Inject the Sentry DSN if the secret and a variable name are both set:
          # replace an existing VAR= line, else append one.
          if [ -n "$SENTRY_DSN" ] && [ -n "$SENTRY_DSN_VAR_NAME" ]; then
            if printf '%s\n' "$BUILD_ARGS" | grep -q "^${SENTRY_DSN_VAR_NAME}="; then
              BUILD_ARGS=$(printf '%s\n' "$BUILD_ARGS" | sed "s|^${SENTRY_DSN_VAR_NAME}=.*|${SENTRY_DSN_VAR_NAME}=${SENTRY_DSN}|")
            else
              BUILD_ARGS="${BUILD_ARGS}${BUILD_ARGS:+$'\n'}${SENTRY_DSN_VAR_NAME}=${SENTRY_DSN}"
            fi
          fi
          {
            echo "build_args<<EOF"
            printf '%s\n' "$BUILD_ARGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare tags
        id: prepare-tags
        env:
          REF: ${{ steps.ref.outputs.ref }}
          EXTRA_TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          TAGS="$REF:$GITHUB_SHA-arm64"
          while IFS= read -r tag; do
            tag="${tag//[[:space:]]/}"
            if [ -n "$tag" ]; then
              TAGS="$TAGS,$REF:$tag-arm64"
            fi
          done <<< "$EXTRA_TAGS"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Built tags: $TAGS"

      - name: Build and push ARM64 image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile_path }}
          platforms: linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.prepare-tags.outputs.tags }}
          build-args: ${{ steps.prepare-args.outputs.build_args }}
          # A plain manifest, so an index built from it lists one entry.
          provenance: false
          cache-from: type=registry,ref=${{ steps.ref.outputs.ref }}:buildcache-arm64
          cache-to: ${{ inputs.push && format('type=registry,ref={0}:buildcache-arm64,mode=max,image-manifest=true,oci-mediatypes=true', steps.ref.outputs.ref) || '' }}

      - name: Output image information
        id: output
        env:
          REF: ${{ steps.ref.outputs.ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PUSH: ${{ inputs.push }}
          REGISTRY: ${{ inputs.registry }}
          EXTRA_TAGS: ${{ inputs.tags }}
          BUILD_ARGS: ${{ inputs.build_args }}
        run: |
          set -euo pipefail
          {
            echo "image_name=$REF"
            echo "image_tag=$GITHUB_SHA-arm64"
            echo "image_fullname=$REF:$GITHUB_SHA-arm64"
          } >> "$GITHUB_OUTPUT"
          echo "✅ ARM64 image built: $REF:$GITHUB_SHA-arm64 ($DIGEST)"

          {
            echo "## 🏗️ ARM64 Image Build Complete"
            echo ""
            echo "| Property | Value |"
            echo "| --- | --- |"
            echo "| Architecture | ARM64 |"
            echo "| Primary Tag | \`$REF:$GITHUB_SHA-arm64\` |"
            echo "| Digest | \`$DIGEST\` |"
            echo "| Pushed | $PUSH |"
            echo "| Registry | ${REGISTRY:-docker.io} |"
            echo "| Runner | $RUNNER_NAME |"
            echo ""
            if [ -n "$EXTRA_TAGS" ]; then
              echo "### Additional Tags"
              while IFS= read -r tag; do
                tag="${tag//[[:space:]]/}"
                if [ -n "$tag" ]; then
                  echo "- \`$REF:$tag-arm64\`"
                fi
              done <<< "$EXTRA_TAGS"
              echo ""
            fi
            if [ -n "$BUILD_ARGS" ]; then
              echo "### Build Arguments"
              echo '```'
              echo "$BUILD_ARGS"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
