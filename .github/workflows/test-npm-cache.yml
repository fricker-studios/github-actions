name: Test npm cache action
on:
  pull_request:
    paths: ['npm-ci/**', '.github/actions/block-cache/**', '.github/workflows/test-npm-cache.yml']
  push:
    branches: [main]
    paths: ['npm-ci/**', '.github/actions/block-cache/**', '.github/workflows/test-npm-cache.yml']
permissions:
  contents: read
jobs:
  cache:
    # Fork code never enters the lab network.
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || matrix.runner }}
    strategy:
      matrix:
        lane: [1, 2]
        runner: [ubuntu-latest, arc-runner-fricker-amd64]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./npm-ci
        with:
          node-version-file: npm-ci/fixture/.nvmrc
          working-directory: npm-ci/fixture
          install-command: npm --prefix npm-ci/fixture ci --no-audit --no-fund
      - run: node --test npm-ci/prepare.test.mjs
      - name: Offline reinstall and dependency smoke test
        run: |
          npm --prefix npm-ci/fixture ci --offline --no-audit --no-fund
          node -e "if (!require('./npm-ci/fixture/node_modules/is-number')(42)) process.exit(1)"
      - name: Change lockfile metadata and discard the local job cache
        run: |
          node -e "const fs=require('fs'),p='npm-ci/fixture/package-lock.json',v=JSON.parse(fs.readFileSync(p));v.packages[''].description=process.env.GITHUB_RUN_ID;fs.writeFileSync(p,JSON.stringify(v));"
          case "$NPM_CONFIG_CACHE" in "$RUNNER_TEMP"/npm-public-*) rm -rf -- "$NPM_CONFIG_CACHE";; *) exit 1;; esac
      - name: Prove fallback restores enough for an offline install
        uses: ./npm-ci
        with:
          node-version-file: npm-ci/fixture/.nvmrc
          working-directory: npm-ci/fixture
          install-command: npm --prefix npm-ci/fixture ci --offline --no-audit --no-fund
      - name: Installation errors must remain errors
        id: failing
        continue-on-error: true
        uses: ./npm-ci
        with:
          node-version-file: npm-ci/fixture/.nvmrc
          working-directory: npm-ci/fixture
          install-command: exit 17
      - name: Assert install failure was preserved
        if: steps.failing.outcome != 'failure'
        run: exit 1
  cache-unavailable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Block only this disposable runner's cache endpoint
        uses: ./.github/actions/block-cache
      - name: Registry remains usable with cache transport unavailable
        uses: ./npm-ci
        with:
          node-version-file: npm-ci/fixture/.nvmrc
          working-directory: npm-ci/fixture
          install-command: npm --prefix npm-ci/fixture ci --no-audit --no-fund
      - name: Discard local cache to test both sources unavailable
        run: |
          case "$NPM_CONFIG_CACHE" in "$RUNNER_TEMP"/npm-public-*) rm -rf -- "$NPM_CONFIG_CACHE";; *) exit 1;; esac
      - name: No cache and no registry must fail
        id: unavailable
        continue-on-error: true
        uses: ./npm-ci
        with:
          node-version-file: npm-ci/fixture/.nvmrc
          working-directory: npm-ci/fixture
          install-command: npm --prefix npm-ci/fixture ci --offline --no-audit --no-fund
      - name: Assert unavailable dependencies fail
        if: steps.unavailable.outcome != 'failure'
        run: exit 1
      - name: Restore disposable runner networking
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/cache-test-original-hosts" ]; then
            sudo tee /etc/hosts < "$RUNNER_TEMP/cache-test-original-hosts" > /dev/null
          fi
